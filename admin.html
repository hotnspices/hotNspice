<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hot 'N' Spice — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --char:#140F0C; --char-2:#1F1712; --ember:#E4531B; --deep-red:#A31D1D;
    --gold:#E8B23D; --cream:#F3E9D8; --ash:#a99b8b;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--char);color:var(--cream);font-family:'DM Sans',sans-serif;min-height:100vh;}
  h1,h2,.display{font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:0.5px;}
  .mono{font-family:'JetBrains Mono',monospace;}

  /* lock screen */
  #lockScreen{
    position:fixed;inset:0;background:var(--char);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;z-index:100;
  }
  #lockScreen h1{font-size:1.6rem;color:var(--ember);}
  #lockScreen input{
    background:var(--char-2);border:1px solid rgba(255,255,255,0.15);color:var(--cream);
    padding:14px 18px;border-radius:6px;font-size:1.2rem;text-align:center;letter-spacing:0.3em;width:200px;
    font-family:'JetBrains Mono',monospace;
  }
  #lockScreen button{
    background:var(--ember);color:var(--char);border:none;padding:12px 28px;border-radius:6px;
    font-family:'Anton',sans-serif;letter-spacing:0.05em;text-transform:uppercase;cursor:pointer;font-size:0.95rem;
  }
  #lockError{color:var(--deep-red);font-size:0.85rem;min-height:18px;}

  header{
    padding:22px 5vw;background:var(--char-2);border-bottom:1px solid rgba(255,255,255,0.08);
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;
  }
  header h1{font-size:1.4rem;color:var(--cream);margin:0;}
  header h1 span{color:var(--ember);}
  .tabs{display:flex;gap:10px;}
  .tab-btn{
    background:transparent;border:1.5px solid rgba(255,255,255,0.15);color:var(--ash);
    padding:10px 18px;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:0.82rem;
    font-weight:700;cursor:pointer;transition:all .2s;
  }
  .tab-btn.active{background:var(--ember);border-color:var(--ember);color:var(--char);}

  main{padding:32px 5vw 80px;max-width:1100px;margin:0 auto;}
  .view{display:none;}
  .view.active{display:block;}

  /* orders */
  .order-card{
    background:var(--char-2);border:1px solid rgba(255,255,255,0.08);border-radius:8px;
    padding:22px 24px;margin-bottom:18px;
  }
  .order-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
  .order-tag{
    display:inline-block;padding:4px 12px;border-radius:20px;font-size:0.72rem;font-weight:700;
    text-transform:uppercase;letter-spacing:0.06em;font-family:'JetBrains Mono',monospace;
  }
  .tag-dinein{background:rgba(232,178,61,0.15);color:var(--gold);border:1px solid var(--gold);}
  .tag-parcel{background:rgba(228,83,27,0.15);color:var(--ember);border:1px solid var(--ember);}
  .order-time{color:var(--ash);font-size:0.78rem;font-family:'JetBrains Mono',monospace;}
  .order-cust{color:var(--cream);font-size:0.95rem;margin-bottom:4px;}
  .order-meta{color:var(--ash);font-size:0.85rem;margin-bottom:14px;}
  .order-items{border-top:1px solid rgba(255,255,255,0.08);padding-top:12px;margin-bottom:14px;}
  .oi-row{display:flex;justify-content:space-between;font-size:0.9rem;padding:4px 0;color:var(--cream);}
  .oi-row span:last-child{color:var(--gold);font-family:'JetBrains Mono',monospace;}
  .order-total{
    display:flex;justify-content:space-between;font-family:'Anton',sans-serif;font-size:1.1rem;
    padding-top:10px;border-top:1px solid rgba(255,255,255,0.08);margin-bottom:16px;
  }
  .order-total span:last-child{color:var(--gold);}
  .order-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  select.status-select{
    background:var(--char);border:1px solid rgba(255,255,255,0.15);color:var(--cream);
    padding:9px 14px;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:0.82rem;cursor:pointer;
  }
  .del-btn{
    background:transparent;border:1px solid var(--deep-red);color:var(--deep-red);
    padding:9px 16px;border-radius:6px;font-size:0.82rem;font-weight:700;cursor:pointer;
  }
  .del-btn:hover{background:var(--deep-red);color:var(--cream);}
  .empty-state{color:var(--ash);text-align:center;padding:60px 0;font-size:0.95rem;}

  .status-pending{border-left:4px solid var(--deep-red);}
  .status-preparing{border-left:4px solid var(--gold);}
  .status-ready{border-left:4px solid var(--ember);}
  .status-completed{border-left:4px solid #3a3a3a;opacity:0.55;}

  /* menu editor */
  .cat-block{margin-bottom:36px;}
  .cat-block h2{font-size:1.1rem;color:var(--gold);margin-bottom:16px;}
  .price-row{
    display:flex;justify-content:space-between;align-items:center;gap:14px;
    padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.07);
  }
  .price-row .pname{font-size:0.92rem;color:var(--cream);}
  .price-row input{
    width:100px;background:var(--char-2);border:1px solid rgba(255,255,255,0.15);color:var(--gold);
    padding:9px 12px;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:0.9rem;text-align:right;
  }
  .save-bar{
    position:sticky;bottom:0;background:var(--char-2);border-top:1px solid rgba(255,255,255,0.1);
    padding:16px 5vw;margin:40px -5vw 0;display:flex;justify-content:center;
  }
  .save-btn{
    background:var(--ember);color:var(--char);border:none;padding:14px 36px;border-radius:6px;
    font-family:'Anton',sans-serif;letter-spacing:0.05em;text-transform:uppercase;font-size:0.95rem;cursor:pointer;
  }
  #saveMsg{color:var(--gold);font-size:0.85rem;margin-left:16px;align-self:center;}
</style>
</head>
<body>

<div id="lockScreen">
  <h1>Hot 'N' Spice — Admin</h1>
  <input type="password" id="pinInput" placeholder="Enter PIN" maxlength="6">
  <button id="pinSubmit">Unlock</button>
  <div id="lockError"></div>
</div>

<header>
  <h1>Hot <span>'N'</span> Spice — Admin Panel</h1>
  <div class="tabs">
    <button class="tab-btn active" id="tabOrders">📋 Live Orders</button>
    <button class="tab-btn" id="tabMenu">💲 Menu &amp; Prices</button>
  </div>
</header>

<main>
  <div class="view active" id="viewOrders">
    <div id="ordersList"><div class="empty-state">Loading orders...</div></div>
  </div>

  <div class="view" id="viewMenu">
    <div id="menuEditor"><div class="empty-state">Loading menu...</div></div>
    <div class="save-bar">
      <button class="save-btn" id="savePrices">Save All Changes</button>
      <span id="saveMsg"></span>
    </div>
  </div>
</main>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDOhrQ6G5VKJeEUWT3npuUkFdzLZmMtMXs",
    authDomain: "hot-n-spice-8c752.firebaseapp.com",
    projectId: "hot-n-spice-8c752",
    storageBucket: "hot-n-spice-8c752.firebasestorage.app",
    messagingSenderId: "596207600859",
    appId: "1:596207600859:web:cc358d26b712b0060cb8fe"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // ---------- simple PIN lock ----------
  const ADMIN_PIN = "1234"; // change this to whatever PIN you want
  const lockScreen = document.getElementById('lockScreen');
  const pinInput = document.getElementById('pinInput');
  const pinSubmit = document.getElementById('pinSubmit');
  const lockError = document.getElementById('lockError');

  function tryUnlock(){
    if(pinInput.value === ADMIN_PIN){
      lockScreen.style.display = 'none';
      sessionStorage.setItem('hnsAdminUnlocked','1');
      initAdmin();
    } else {
      lockError.textContent = 'Galat PIN, dobara try karein.';
    }
  }
  pinSubmit.addEventListener('click', tryUnlock);
  pinInput.addEventListener('keydown', e=>{ if(e.key === 'Enter') tryUnlock(); });

  // ---------- tabs ----------
  const tabOrders = document.getElementById('tabOrders');
  const tabMenu = document.getElementById('tabMenu');
  const viewOrders = document.getElementById('viewOrders');
  const viewMenu = document.getElementById('viewMenu');
  tabOrders.addEventListener('click', ()=>{
    tabOrders.classList.add('active'); tabMenu.classList.remove('active');
    viewOrders.classList.add('active'); viewMenu.classList.remove('active');
  });
  tabMenu.addEventListener('click', ()=>{
    tabMenu.classList.add('active'); tabOrders.classList.remove('active');
    viewMenu.classList.add('active'); viewOrders.classList.remove('active');
  });

  // ---------- menu structure (mirrors index.html item names) ----------
  const MENU_CATEGORIES = [
    { label:'Shawarma', items:[
      'Classic Shawarma','Classic Cheese Shawarma','Mexican Shawarma','Mexican Cheese Shawarma',
      'Hariyali Shawarma','Hariyali Cheese Shawarma','Peri Peri Shawarma','Peri Peri Cheese Shawarma',
      'Protein Box','Open Platter'
    ]},
    { label:'Extra Add-ons', items:[
      'Add-on: Cheese','Add-on: Peri Peri','Add-on: Fries','Add-on: Chutneys'
    ]},
    { label:'Soups (Chicken)', items:[
      'Chicken Manchow Soup','Chicken Schezwan Soup','Chicken Garlic Soup',
      'Chicken Lung Fung Soup','Chicken Clear Soup','Chicken Hot n Sour Soup'
    ]},
    { label:'Rice', items:[
      'Fried Rice (Half)','Fried Rice (Full)','Veg. Schezwan Rice (Half)','Veg. Schezwan Rice (Full)',
      'Veg. Tripple Rice (Half)','Veg. Tripple Rice (Full)'
    ]},
    { label:'Noodles', items:[
      'Veg. Hakka Noodles (Half)','Veg. Hakka Noodles (Full)','Veg. Schezwan Noodles (Half)','Veg. Schezwan Noodles (Full)',
      'Veg. Tripple Noodles (Half)','Veg. Tripple Noodles (Full)','Veg. Chilly Noodles (Half)','Veg. Chilly Noodles (Full)',
      'Veg. Chopper Noodles (Half)','Veg. Chopper Noodles (Full)','Veg. Sherpa Noodles (Half)','Veg. Sherpa Noodles (Full)',
      'Veg. Thousand Noodles (Half)','Veg. Thousand Noodles (Full)','Veg. Manchurian No. (Half)','Veg. Manchurian No. (Full)',
      'Veg. Singaporean No. (Half)','Veg. Singaporean No. (Full)'
    ]},
    { label:'Soups (Veg)', items:[
      'Veg. Manchow Soup','Veg. Schezwan Soup','Veg. Garlic Soup'
    ]}
  ];

  function initAdmin(){
    initOrders();
    initMenuEditor();
  }

  // ---------- orders feed ----------
  function initOrders(){
    db.collection('orders').orderBy('createdAt','desc').onSnapshot(snapshot=>{
      const list = document.getElementById('ordersList');
      if(snapshot.empty){
        list.innerHTML = '<div class="empty-state">Abhi koi order nahi aaya hai.</div>';
        return;
      }
      list.innerHTML = snapshot.docs.map(docSnap=>{
        const o = docSnap.data();
        const id = docSnap.id;
        const status = o.status || 'pending';
        const time = o.createdAt && o.createdAt.toDate ? o.createdAt.toDate().toLocaleString() : 'Just now';
        const tagClass = o.orderType === 'Parcel' ? 'tag-parcel' : 'tag-dinein';
        const tagText = o.orderType === 'Parcel' ? `🥡 Parcel — ${o.pickupTime || 'ASAP'}` : `🍽️ Table ${o.tableNumber || '-'}`;
        const itemsHtml = (o.items||[]).map(i=>`
          <div class="oi-row"><span>${i.name} × ${i.qty}</span><span>₹${i.price * i.qty}</span></div>
        `).join('');
        return `
          <div class="order-card status-${status}">
            <div class="order-top">
              <div>
                <span class="order-tag ${tagClass}">${tagText}</span>
              </div>
              <span class="order-time mono">${time}</span>
            </div>
            <div class="order-cust"><b>${o.name || 'Not provided'}</b></div>
            <div class="order-meta">📞 ${o.phone || 'Not provided'} &nbsp;·&nbsp; 💵 ${o.payment || 'Cash'}</div>
            <div class="order-items">${itemsHtml}</div>
            <div class="order-total"><span>Total</span><span>₹${o.total}</span></div>
            <div class="order-actions">
              <select class="status-select" onchange="window.__updateStatus('${id}', this.value)">
                <option value="pending" ${status==='pending'?'selected':''}>Pending</option>
                <option value="preparing" ${status==='preparing'?'selected':''}>Preparing</option>
                <option value="ready" ${status==='ready'?'selected':''}>Ready</option>
                <option value="completed" ${status==='completed'?'selected':''}>Completed</option>
              </select>
              <button class="del-btn" onclick="window.__deleteOrder('${id}')">Delete</button>
            </div>
          </div>`;
      }).join('');
    }, err=>{
      document.getElementById('ordersList').innerHTML = '<div class="empty-state">Orders load nahi ho paaye — Firestore rules check karein.</div>';
      console.error(err);
    });
  }
  window.__updateStatus = (id, status)=>{
    db.collection('orders').doc(id).update({status});
  };
  window.__deleteOrder = (id)=>{
    if(confirm('Is order ko delete karna hai?')){
      db.collection('orders').doc(id).delete();
    }
  };

  // ---------- menu / price editor ----------
  function initMenuEditor(){
    db.collection('menu').doc('prices').get().then(doc=>{
      const prices = doc.exists ? doc.data() : {};
      const editor = document.getElementById('menuEditor');
      editor.innerHTML = MENU_CATEGORIES.map(cat=>`
        <div class="cat-block">
          <h2>${cat.label}</h2>
          ${cat.items.map(name=>`
            <div class="price-row">
              <span class="pname">${name}</span>
              <input type="number" class="price-input" data-name="${name}" value="${prices[name] ?? ''}" placeholder="₹">
            </div>
          `).join('')}
        </div>
      `).join('');
    });
  }

  document.getElementById('savePrices').addEventListener('click', ()=>{
    const updates = {};
    document.querySelectorAll('.price-input').forEach(inp=>{
      const val = parseFloat(inp.value);
      if(!isNaN(val)) updates[inp.dataset.name] = val;
    });
    const saveMsg = document.getElementById('saveMsg');
    saveMsg.textContent = 'Saving...';
    db.collection('menu').doc('prices').set(updates, {merge:true}).then(()=>{
      saveMsg.textContent = '✅ Saved! Website par turant update ho jayega.';
      setTimeout(()=>saveMsg.textContent='', 4000);
    }).catch(err=>{
      saveMsg.textContent = '❌ Error saving.';
      console.error(err);
    });
  });

  // stay unlocked within the same browser tab session
  if(sessionStorage.getItem('hnsAdminUnlocked') === '1'){
    lockScreen.style.display = 'none';
    initAdmin();
  }
</script>
</body>
</html>
